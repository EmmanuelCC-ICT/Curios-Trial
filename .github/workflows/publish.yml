name: Publish Curios Learning World
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: curios-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'EmmanuelCC-ICT/Curios-Trial'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Unpack reviewed prototype source on first setup
        run: |
          if [ ! -f tools/materialize-assets.py ]; then
            tar -xzf source-overlay.tar.gz
          fi
      - name: Make independent verified asset copies
        run: python3 tools/materialize-assets.py
      - name: Check source and independent configuration
        run: |
          node tools/check.mjs
          node --test tests/*.test.mjs
      - name: Save full independent source in this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md .gitignore .nojekyll README.md docs index.html package.json playable-3d teacher.html teacher-editor.mjs tests tools world-config.json
          if ! git diff --cached --quiet; then
            git commit -m "Materialise reviewed independent Curios prototype"
            git push origin HEAD:main
          fi
      - name: Package static site
        run: python3 tools/package-site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
