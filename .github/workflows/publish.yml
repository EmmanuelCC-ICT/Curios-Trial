name: Publish Curios Learning World
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: curios-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'EmmanuelCC-ICT/Curios-Trial'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check independent asset copies
        run: python3 tools/materialize-assets.py
      - name: Check source and teacher configuration
        run: |
          node tools/check.mjs
          node --test tests/*.test.mjs
      - name: Package static site
        run: python3 tools/package-site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
